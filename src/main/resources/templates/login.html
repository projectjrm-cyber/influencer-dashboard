<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veena Krishna - Dashboard Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
        * {
            font-family: 'Poppins', 'Noto Sans Kannada', sans-serif;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            background: linear-gradient(135deg, #a55eea, #fd79a8, #fab1a0);
            background-size: 200% 200%;
            position: relative;
        }

        /* --- Alternate gradient for E-commerce theme (cross-fades in) --- */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(135deg, #ff9ff3, #feca57, #ff6b9d);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }
        body.theme-ecommerce::before {
            opacity: 1;
        }

        /* --- Floating Playful Kid Elements --- */
        .baby-container {
            transition: opacity 0.35s ease;
        }
        .baby-container.swapping {
            opacity: 0;
        }
        .baby-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }
        .floating-baby {
            position: absolute;
            bottom: -100px;
            font-size: 3.5rem;
            opacity: 0.75;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
            animation: babyFloatUp 14s linear infinite;
        }
        .baby1 { left: 8%; font-size: 3.8rem; animation-duration: 16s; animation-delay: 0s; }
        .baby2 { left: 22%; font-size: 3.2rem; animation-duration: 19s; animation-delay: 4s; }
        .baby3 { left: 40%; font-size: 2.8rem; animation-duration: 12s; animation-delay: 1s; }
        .baby4 { left: 62%; font-size: 3.5rem; animation-duration: 17s; animation-delay: 6s; }
        .baby5 { left: 78%; font-size: 4rem; animation-duration: 22s; animation-delay: 2s; }
        .baby6 { left: 90%; font-size: 3rem; animation-duration: 14s; animation-delay: 8s; }

        @keyframes babyFloatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.85; }
            90% { opacity: 0.85; }
            100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
        }

        /* --- White Form Container Card --- */
        .login-card {
            width: 440px;
            max-width: 92vw;
            padding: 40px 35px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
            color: #2d3436;
            z-index: 10;
            text-align: center;
        }

        .brand-icon-box {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #a55eea, #fd79a8);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            color: white;
            font-size: 22px;
            box-shadow: 0 5px 15px rgba(253, 121, 168, 0.3);
        }

        .welcome-title {
            font-size: 26px;
            font-weight: 700;
            color: #2d3436;
            margin: 0 0 2px;
        }

        .subtitle-text {
            color: #b2bec3;
            font-size: 14px;
            margin: 0 0 10px;
        }

        .kannada-badge {
            background: #fff0f3;
            color: #e84393;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 20px;
        }

        /* --- Dashboard Toggle --- */
        .dash-toggle {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #f1f2f6;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
        }
        .dash-toggle .slider {
            position: absolute;
            top: 4px;
            left: 4px;
            width: calc(50% - 4px);
            height: calc(100% - 8px);
            background: linear-gradient(135deg, #a55eea, #fd79a8);
            border-radius: 9px;
            box-shadow: 0 4px 12px rgba(253, 121, 168, 0.35);
            transition: transform 0.3s cubic-bezier(.4, 0, .2, 1);
        }
        .dash-toggle[data-active="ecommerce"] .slider {
            transform: translateX(100%);
        }
        .toggle-btn {
            position: relative;
            z-index: 1;
            border: none;
            background: transparent;
            height: 40px;
            font-size: 13px;
            font-weight: 600;
            color: #636e72;
            cursor: pointer;
            border-radius: 9px;
            transition: color 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }
        .toggle-btn.active {
            color: #ffffff;
        }
        .toggle-btn:focus-visible {
            outline: 2px solid #e84393;
            outline-offset: 2px;
        }

        /* --- Inputs --- */
        .form-group-block {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .form-label {
            color: #2d3436;
            font-weight: 500;
            font-size: 13px;
            margin: 0;
        }

        .forgot-link {
            color: #fd79a8;
            font-size: 12px;
            text-decoration: none;
            font-weight: 500;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid #dfe6e9;
            border-radius: 10px;
            background: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
            overflow: hidden;
        }
        .input-wrapper:focus-within {
            border-color: #fd79a8;
            box-shadow: 0 0 0 3px rgba(253, 121, 168, 0.15);
        }

        .input-icon {
            padding-left: 14px;
            padding-right: 8px;
            color: #b2bec3;
            font-size: 14px;
        }

        .form-control-field {
            border: none;
            width: 100%;
            height: 46px;
            font-size: 14px;
            color: #2d3436;
            outline: none;
            padding-right: 14px;
        }
        .form-control-field::placeholder {
            color: #b2bec3;
        }

        .btn-submit {
            height: 48px;
            font-weight: 600;
            font-size: 15px;
            border-radius: 10px;
            background: #e84393;
            color: white;
            border: none;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #d63031;
            color: white;
        }
        .btn-submit:active {
            transform: scale(0.98);
        }

        .footer-note {
            margin-top: 25px;
            font-size: 13px;
            color: #b2bec3;
        }
        .footer-note a {
            color: #e84393;
            text-decoration: none;
            font-weight: 600;
        }
        .footer-note a:hover {
            text-decoration: underline;
        }

        /* --- Messages --- */
        .alert { padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 18px; text-align: left; }
        .alert:empty { display: none; }
        .alert-error { background: #fff0f0; color: #d63031; border: 1px solid #fab1a0; }
        .alert-success { background: #eafaf1; color: #1e8449; border: 1px solid #a9dfbf; }

        /* --- Responsive: phones, small tablets, short screens --- */
        @media (max-width: 480px) {
            .login-card { padding: 28px 20px; border-radius: 20px; }
            .welcome-title { font-size: 22px; }
            .form-control-field { font-size: 16px; } /* stops iOS zoom on focus */
            .toggle-btn { font-size: 12px; gap: 5px; }
            .floating-baby { font-size: 2.4rem; }
        }
        @media (max-width: 360px) {
            .toggle-btn i { display: none; }
        }
        @media (max-height: 640px) {
            body { align-items: flex-start; }
            .brand-icon-box { display: none; }
        }
    </style>
</head>
<body>

<!-- Dynamic Baby Items Backdrop -->
<div class="baby-container" id="floatLayer">
  <div class="floating-baby baby1">👶</div>
  <div class="floating-baby baby2">🍼</div>
  <div class="floating-baby baby3">⭐</div>
  <div class="floating-baby baby4">🧸</div>
  <div class="floating-baby baby5">💖</div>
  <div class="floating-baby baby6">🍼</div>
</div>

<!-- Centered Login Interface -->
<div class="login-card">
  <div class="brand-icon-box">
    <i class="fa-solid fa-right-to-bracket"></i>
  </div>

  <h2 class="welcome-title" id="welcomeTitle">Welcome back Veena Krishna</h2>
  <p class="subtitle-text" id="subtitleText">Log in to your Consultation dashboard</p>

  <div class="kannada-badge" id="badgeText">
    ಅಮ್ಮಂದಿರಿಗಾಗಿ 0-8 years ಮಕ್ಕಳ ಎಲ್ಲಾ information
  </div>

  <!-- Dashboard Toggle -->
  <div class="dash-toggle" id="dashToggle" data-active="consultation" role="tablist" aria-label="Choose dashboard">
    <span class="slider"></span>
    <button type="button" class="toggle-btn active" data-value="consultation" role="tab" aria-selected="true">
      <i class="fa-solid fa-user-doctor"></i> Consultation
    </button>
    <button type="button" class="toggle-btn" data-value="ecommerce" role="tab" aria-selected="false">
      <i class="fa-solid fa-cart-shopping"></i> E-commerce
    </button>
  </div>

  <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
  <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

  <form method="post" action="/login">
    <!-- Sent to the server so it knows which dashboard to open -->
    <input type="hidden" name="dashboard" id="dashboardField" value="consultation">

    <div class="form-group-block">
      <div class="form-label-row">
        <label class="form-label" for="username">Username</label>
      </div>
      <div class="input-wrapper">
        <span class="input-icon"><i class="fa-regular fa-envelope"></i></span>
        <input type="text" id="username" name="username" class="form-control-field" placeholder="you@example.com" required>
      </div>
    </div>

    <div class="form-group-block">
      <div class="form-label-row">
        <label class="form-label" for="password">Password</label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>
      <div class="input-wrapper">
        <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
        <input type="password" id="password" name="password" class="form-control-field" placeholder="••••••••" required>
      </div>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Log in to Consultation</button>
  </form>

  <div class="footer-note">
    Don't have an account? <a href="/register">Create one</a>
  </div>
</div>

<script>
  (function () {
    var toggle = document.getElementById('dashToggle');
    var buttons = toggle.querySelectorAll('.toggle-btn');
    var field = document.getElementById('dashboardField');
    var subtitle = document.getElementById('subtitleText');
    var submitBtn = document.getElementById('submitBtn');

    var labels = {
      consultation: 'Consultation',
      ecommerce: 'E-commerce'
    };

    // Background items + badge text for each theme (6 items each)
    var themes = {
      consultation: {
        title: 'Welcome back Veena Krishna',
        items: ['👶', '🍼', '⭐', '🧸', '💖', '🍼'],
        badge: 'ಅಮ್ಮಂದಿರಿಗಾಗಿ 0-8 years ಮಕ್ಕಳ ಎಲ್ಲಾ information'
      },
      ecommerce: {
        title: 'Welcome back Krishna',
        items: ['👗', '🎀', '👚', '🧦', '👒', '🩰'],
        badge: 'ಮಕ್ಕಳ ಉಡುಪುಗಳು 0-8 years'
      }
    };

    var layer = document.getElementById('floatLayer');
    var floaters = layer.querySelectorAll('.floating-baby');
    var badge = document.getElementById('badgeText');
    var welcomeTitle = document.getElementById('welcomeTitle');
    var currentTheme = null;

    function applyTheme(value) {
      if (value === currentTheme) return;
      var first = currentTheme === null;
      currentTheme = value;
      document.body.classList.toggle('theme-ecommerce', value === 'ecommerce');

      function swap() {
        floaters.forEach(function (el, i) {
          el.textContent = themes[value].items[i];
        });
        badge.textContent = themes[value].badge;
        welcomeTitle.textContent = themes[value].title;
        document.title = themes[value].title.replace('Welcome back ', '') + ' - Dashboard Login';
        layer.classList.remove('swapping');
      }

      if (first) {
        swap();
      } else {
        layer.classList.add('swapping');
        setTimeout(swap, 350);
      }
    }

    function setDashboard(value, save) {
      if (!labels[value]) value = 'consultation';
      applyTheme(value);
      toggle.setAttribute('data-active', value);
      field.value = value;
      subtitle.textContent = 'Log in to your ' + labels[value] + ' dashboard';
      submitBtn.textContent = 'Log in to ' + labels[value];
      buttons.forEach(function (b) {
        var on = b.getAttribute('data-value') === value;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      if (save) {
        try { localStorage.setItem('dashboardChoice', value); } catch (e) {}
      }
    }

    buttons.forEach(function (b) {
      b.addEventListener('click', function () {
        setDashboard(b.getAttribute('data-value'), true);
      });
    });

    // Restore: URL param (?dashboard=ecommerce) wins, then last saved choice
    var initial = new URLSearchParams(window.location.search).get('dashboard');
    if (!initial) {
      try { initial = localStorage.getItem('dashboardChoice'); } catch (e) {}
    }
    setDashboard(initial || 'consultation', false);
  })();
</script>

</body>
</html>
