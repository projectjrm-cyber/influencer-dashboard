spring.application.name=influencer-dashboard

# ---------- Server ----------
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true

# ---------- Database (Neon PostgreSQL) - values come from environment variables ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=30000

# ---------- Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---------- Uploads (payment screenshots) ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------- Registration secret code (registration is disabled if empty) ----------
app.registration.code=${REGISTRATION_CODE:}